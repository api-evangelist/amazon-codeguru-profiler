aid: amazon-codeguru-profiler
name: Amazon CodeGuru Profiler
description: Amazon CodeGuru Profiler collects runtime performance data from your live applications, providing recommendations
  to help you reduce CPU utilization, cut costs, and improve application performance. The profiler analyzes your
  application's CPU and heap usage to identify the most expensive lines of code and offers actionable recommendations.
