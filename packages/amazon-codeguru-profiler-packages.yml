currency_finding: >-
  The generated SDK clients are current — npm, boto3, Java v2, Go, NuGet, crates and RubyGems
  all published within the last two months, most within days, because they ride the AWS-wide
  SDK release train and move whether or not this service changes. The two artifacts that are
  actually CodeGuru Profiler-specific — the packages a customer installs into their own
  application — are the stale ones: the JVM agent last shipped 2026-02-25 (1.2.6, six months)
  and the Python agent 2025-12-11 (1.2.6, nine months). Read alongside an API version frozen at
  2019-07-18 and a provider changelog whose newest dated entry is July 2021, the agent release
  cadence is the only first-party dated signal here and it points at a service in steady state
  rather than active development.
