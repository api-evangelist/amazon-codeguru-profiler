domain_standard:
  market: application-performance-monitoring / continuous profiling
  declared_in_contract: false
  candidates_checked:
    - id: opentelemetry-profiles
      declared: false
      note: >-
        OpenTelemetry is the live standardisation effort for this market and its profiling
        signal is the relevant candidate. The CodeGuru Profiler contract declares NO OTLP
        endpoint, no pprof media type, and no OpenTelemetry semantic conventions. GetProfile and
        PostAgentProfile negotiate an AWS-proprietary profile format through Accept /
        Content-Type and the payload is not modelled in the spec at all.
    - id: pprof
      declared: false
      note: >-
        No application/vnd.google.protobuf pprof media type appears in any of the four specs.
    - id: otlp
      declared: false
      note: No OTLP/gRPC or OTLP/HTTP surface; the service ships no .proto.
  conforms: false
  evidence: >-
    Checked the four refined OpenAPI documents and the original aws2openapi source for any
    profiling-interchange media type, OTLP path or semantic-convention attribute. None present.
  note: >-
    REWARD-ONLY check: recorded as an honest absence, not a penalty. The finding that matters to
    a buyer is portability — profile data submitted through PostAgentProfile is in an
    unpublished AWS format, so there is no standards-based path to move it to, or read it with,
    another profiler.
