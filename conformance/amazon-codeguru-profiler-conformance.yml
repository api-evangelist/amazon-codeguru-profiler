description: >-
  Cross-cutting standards conformance for Amazon CodeGuru Profiler. The API is an AWS
  JSON/REST service authenticated with Signature Version 4. It does not use OAuth2/OIDC,
  RFC 9457 problem+json, or any of the sector interop standards.
standards:
  - id: aws-sigv4
    conforms: true
    evidence: >-
      x-aws-signingName codeguru-profiler in the spec; AWS Signature Version 4 request signing
      is required on every operation.
  - id: oauth2
    conforms: false
    evidence: No oauth2 securityScheme in any of the four specs; AWS uses SigV4 IAM credentials.
  - id: oidc
    conforms: false
    evidence: >-
      /.well-known/openid-configuration probed 2026-09-01 on all three hosts — 403, 404 and 301->404.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Error responses use application/json AWS exception shapes with x-amzn-ErrorType, not
      application/problem+json.
  - id: rfc9116-security-txt
    conforms: true
    evidence: >-
      https://aws.amazon.com/.well-known/security.txt returned HTTP 200 on 2026-09-01 with
      Policy, Contact, Encryption, Preferred-Languages, Expires and Hiring fields.
  - id: pagination
    conforms: true
    evidence: >-
      Cursor pagination via maxResults + nextToken on ListProfilingGroups, ListProfileTimes,
      ListFindingsReports and GetFindingsReportAccountSummary.
  - id: idempotency
    conforms: true
    evidence: >-
      CreateProfilingGroup requires a clientToken UUID; PostAgentProfile accepts a profileToken
      UUID. Both are documented as preventing duplicates on retry.
  - id: optimistic-concurrency
    conforms: true
    evidence: >-
      revisionId on the profiling group resource policy; PutPermission/RemovePermission return
      ConflictException (409) on a stale revision.
  - id: iso8601-timestamps
    conforms: true
    evidence: >-
      "Specify using the ISO 8601 format. For example, 2020-06-01T13:15:02.001Z" on every
      Timestamp field.
  - id: rfc8594-sunset
    conforms: false
    evidence: No Sunset or Deprecation response headers declared; no deprecation policy published.
  - id: rfc6570-uri-templates
    conforms: true
    evidence: 'servers[] declares a templated host: http://codeguru-profiler.{region}.amazonaws.com with a region enum.'
  - id: json-api
    conforms: false
